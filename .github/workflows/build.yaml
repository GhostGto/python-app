name: ci

on:
  push:
    paths:
        - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: self-hosted
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Get short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghost0/python-app:${{ steps.vars.outputs.sha_short }}

  cd:
    runs-on: self-hosted
    steps:
      env:
        name: ArgoCD Login
        password: ${{ secrets.ARGOCD_PASS }}
        username: admin

      - name: ArgoCD app sync
        shell: bash
        run:  argocd login argocd.test.com:80 --insecure --grpc-web --username admin --password 