name: ci

on:
  push:
    paths:
        - src/**
        - .github/workflows/**
    branches:
      - main

jobs:
  ci:
    runs-on: self-hosted
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Get short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghost0/python-app:${{ steps.vars.outputs.sha_short }}
    outputs:
        commit_id: ${{ steps.vars.outputs.sha_short }}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
     
      - name: Checkout
        uses: actions/checkout@v4

      - run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64

      - name: Install yq
        shell: bash
        run: |
            sudo apt update
            sudo apt install -y pipx
            pipx ensurepath
            pipx install yq  

      - name: Modify values files
        shell: bash
        run: |
          echo ${{ needs.ci.outputs.commit_id }}
          yq -Yi '.image.tag = strenv(commit_id)' charts/python-app/values.yaml

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update image tag to ${{ needs.ci.outputs.commit_id }}"

      - name: Login to ArgoCD
        shell: bash
        run:  |
          argocd login argocd.test.com:80 \
            --insecure \
            --grpc-web \
            --plaintext \
            --username admin \
            --password ${{ secrets.ARGOCD_PASS }} 

      - name: Sync ArgoCD Application
        shell: bash
        run:  |
          argocd app sync python-app