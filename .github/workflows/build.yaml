name: ci

on:
  push:
    paths:
        - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: self-hosted
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Get short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghost0/python-app:${{ steps.vars.outputs.sha_short }}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      
      - name: Checkout
        uses: actions/checkout@v4

      - run: |
          VERSION=$(curl -fsSL https://raw.githubusercontent.com/argoproj/argo-cd/stable/VERSION)
          curl -fsSL -o argocd \
            "https://github.com/argoproj/argo-cd/releases/download/${VERSION}/argocd-linux-amd64"
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd
          argocd version --client

      - name: Login to ArgoCD
        shell: bash
        run:  |
          argocd login argocd.test.com:80 \
            --insecure \
            --grpc-web \
            --username admin \
            --password ${{ secrets.ARGOCD_PASS }} 

      - name: Sync ArgoCD Application
        shell: bash
        run:  |
          argocd app sync python-app