redis-ha:
  enabled: false

controller:
  replicas: 1

server:
  replicas: 2
  extraArgs:
    - --insecure
  ingress:
    enabled: true
    ingressClassName: cloud-provider-kind
    tls: true

repoServer:
  replicas: 2

applicationSet:
  replicas: 2

global:
  domain: argocd.test.com

certificate:
  enabled: true